schema_version: offline_index_build_config_v1
build_id: m3e_milvus_lite_full_corpus_v2
dataset_version: cleaned_text_units_full_corpus_v2
source:
  path: data/raw/jsonl
  format: jsonl
chunker:
  name: fixed_parent_child
  version: v1
  params:
    parent_chunk_size: 1500
    parent_chunk_overlap: 150
    child_chunk_size: 500
    child_chunk_overlap: 50
    unit: token
    tokenizer_model_name: D:/models/huggingface/embedding/m3e-base
    tokenizer_local_files_only: true
    parent_chunk_version: parent_chunk_v1.0
    child_chunk_version: child_chunk_v1.0
embedding:
  mode: model
  name: m3e_base
  version: local_m3e_base_v1
  model_name: D:/models/huggingface/embedding/m3e-base
  device: cuda
  batch_size: 32
  dim: 768
index:
  backend: milvus_lite
  metric_type: COSINE
  collection_name: rag_child_chunks
  recreate: true
  insert_batch_size: 128
  max_text_chars: 8192
outputs:
  root_dir: data/processed/indexes
  active_pointer: data/processed/indexes/active_index.json
  update_active_pointer: false
deterministic_created_at: "2026-08-03T00:00:00+08:00"
notes: Full local corpus build. Reads every JSON/JSONL source file directly under data/raw/jsonl, preserves approved producer metadata in extra, and excludes should_index=false gold records before chunking.
