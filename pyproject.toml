[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-agent"
version = "0.1.0"
description = "Domain-owned enterprise document RAG workflow runtime"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "langchain-core==1.4.9",
    "langgraph==1.2.9",
    "langgraph-checkpoint==4.1.1",
    "langgraph-checkpoint-sqlite==3.1.0",
    "numpy==1.26.4",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "tomli==2.4.0",
]

[project.optional-dependencies]
local-rag = [
    "pymilvus==3.0.0",
    "milvus-lite==3.0",
]
local-model = [
    "sentence-transformers==3.0.1",
]
providers = [
    "langchain-openai==1.3.5",
]
test = [
    "pytest==9.1.1",
]
dev = [
    "pytest==9.1.1",
]
document-ingestion = [
    "pywin32==312; platform_system == 'Windows'",
]
durable-memory = [
    "psycopg[binary]==3.3.3",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["backend", "scripts"]
testpaths = ["backend/tests"]
addopts = "-ra"
markers = [
    "real_provider: opt-in tests that make billable external provider calls",
    "word_com: opt-in tests that require Microsoft Word COM automation",
]

[tool.uv]
required-version = "==0.11.32"
