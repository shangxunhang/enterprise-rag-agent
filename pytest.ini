[pytest]
pythonpath =
    backend
    scripts
testpaths = backend/tests
addopts = -ra
markers =
    unit: isolated deterministic unit tests
    contract: schema, port, and boundary contract tests
    component_integration: integration tests across local runtime components
    standalone_e2e: standalone vertical E2E with injected adapters
    recovery_e2e: checkpoint and event based standalone recovery E2E
    real_provider: opt-in tests that make billable external provider calls
    word_com: opt-in tests that require Microsoft Word COM automation
